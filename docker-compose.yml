# Local platform: docker compose up --build -d   then open http://localhost:3000
name: shopsphere

x-java-service: &java-service
  restart: unless-stopped
  mem_limit: 512m
  security_opt: [ "no-new-privileges:true" ]
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 60s

x-rabbit-env: &rabbit-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USERNAME: "${RABBITMQ_DEFAULT_USER:-shopsphere}"
  RABBITMQ_PASSWORD: "${RABBITMQ_DEFAULT_PASS:-shopsphere_local_password}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_DB: shopsphere, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-shopsphere_local_password}" }
    volumes: [ "postgres-data:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 10s, timeout: 5s, retries: 10 }
  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes: [ "mongo-data:/data/db" ]
    healthcheck: { test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"], interval: 10s, timeout: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [ "redis-data:/data" ]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 10 }
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment: { RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-shopsphere}", RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-shopsphere_local_password}" }
    ports: ["15672:15672"]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, timeout: 5s, retries: 10 }

  frontend:
    build: { context: ./frontend }
    image: shopsphere/frontend:latest
    restart: unless-stopped
    ports: ["3000:8080"]
    environment: { API_GATEWAY_URL: "http://api-gateway:8080" }
    depends_on: { api-gateway: { condition: service_started } }
  api-gateway:
    <<: *java-service
    build: { context: ., args: { MODULE: services/api-gateway } }
    image: shopsphere/api-gateway:latest
    ports: ["8080:8080"]
    environment:
      JWT_SECRET: "${JWT_SECRET:-local-dev-jwt-secret-change-me-0123456789}"
      REDIS_HOST: redis
      AUTH_SERVICE_URL: http://auth-service:8080
      PRODUCT_SERVICE_URL: http://product-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      CART_SERVICE_URL: http://cart-service:8080
      ORDER_SERVICE_URL: http://order-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
    depends_on: { redis: { condition: service_healthy } }
  auth-service:
    <<: *java-service
    build: { context: ., args: { MODULE: services/auth-service } }
    image: shopsphere/auth-service:latest
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/shopsphere
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-shopsphere_local_password}"
      JWT_SECRET: "${JWT_SECRET:-local-dev-jwt-secret-change-me-0123456789}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-Admin@12345}"
    depends_on: { postgres: { condition: service_healthy } }
  product-service:
    <<: *java-service
    build: { context: ., args: { MODULE: services/product-service } }
    image: shopsphere/product-service:latest
    environment: { MONGODB_URI: "mongodb://mongodb:27017/product_db" }
    depends_on: { mongodb: { condition: service_healthy } }
  inventory-service:
    <<: *java-service
    build: { context: ., args: { MODULE: services/inventory-service } }
    image: shopsphere/inventory-service:latest
    environment:
      <<: *rabbit-env
      MONGODB_URI: mongodb://mongodb:27017/inventory_db
    depends_on: { rabbitmq: { condition: service_healthy }, mongodb: { condition: service_healthy } }
  cart-service:
    <<: *java-service
    build: { context: ., args: { MODULE: services/cart-service } }
    image: shopsphere/cart-service:latest
    environment: { REDIS_HOST: redis }
    depends_on: { redis: { condition: service_healthy } }
  order-service:
    <<: *java-service
    build: { context: ., args: { MODULE: services/order-service } }
    image: shopsphere/order-service:latest
    environment:
      <<: *rabbit-env
      PRODUCT_SERVICE_URL: http://product-service:8080
      MONGODB_URI: mongodb://mongodb:27017/order_db
    depends_on: { rabbitmq: { condition: service_healthy }, mongodb: { condition: service_healthy } }
  payment-service:
    <<: *java-service
    build: { context: ., args: { MODULE: services/payment-service } }
    image: shopsphere/payment-service:latest
    environment:
      <<: *rabbit-env
      PAYMENT_FAILURE_RATE: "${PAYMENT_FAILURE_RATE:-0}"
    depends_on: { rabbitmq: { condition: service_healthy } }
  notification-service:
    <<: *java-service
    build: { context: ., args: { MODULE: services/notification-service } }
    image: shopsphere/notification-service:latest
    environment:
      <<: *rabbit-env
      MONGODB_URI: mongodb://mongodb:27017/notification_db
    depends_on: { rabbitmq: { condition: service_healthy }, mongodb: { condition: service_healthy } }
  report-job:
    build: { context: ., args: { MODULE: services/report-job } }
    image: shopsphere/report-job:latest
    profiles: [ "jobs" ]

volumes:
  postgres-data:
  mongo-data:
  redis-data:
