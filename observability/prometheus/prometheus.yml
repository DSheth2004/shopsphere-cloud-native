global:
  scrape_interval: 15s
scrape_configs:
  - job_name: shopsphere
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080", "auth-service:8081", "product-service:8082", "inventory-service:8083", "cart-service:8084", "order-service:8085", "payment-service:8086", "notification-service:8087"]
