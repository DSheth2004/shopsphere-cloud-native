# Optional monitoring add-on, started next to the main stack:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
# Prometheus: http://localhost:9090   Grafana: http://localhost:3001 (admin/admin)
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3001:3000"]
