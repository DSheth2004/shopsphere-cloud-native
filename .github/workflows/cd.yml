name: CD

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build, scan and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing (Sigstore OIDC)
    strategy:
      fail-fast: false
      matrix:
        image: [frontend, api-gateway, auth-service, product-service, inventory-service, cart-service, order-service, payment-service, notification-service, report-job]
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/shopsphere-${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image == 'frontend' && 'frontend' || '.' }}
          build-args: MODULE=services/${{ matrix.image }}
          load: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Scan image before pushing (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        run: |
          docker push --all-tags "$IMAGE"
          echo "DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:sha-$SHORT_SHA")" >> "$GITHUB_ENV"
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.DIGEST }}
          format: cyclonedx
          output: sbom-${{ matrix.image }}.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Sign image and attach SBOM attestation (cosign keyless)
        run: |
          cosign sign --yes "$DIGEST"
          cosign attest --yes --type cyclonedx --predicate "sbom-${{ matrix.image }}.cdx.json" "$DIGEST"

  deploy:
    name: Deploy to AWS (k3s on EC2)
    needs: images
    # Runs once Terraform has been applied and the two repository variables are set.
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    # No `environment:` here: it would change the OIDC subject to repo:<repo>:environment:<name>,
    # and the AWS deploy role only trusts repo:<repo>:ref:refs/heads/<branch> (infra/terraform/iam.tf).
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Roll out on the node through SSM
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "ShopSphere ${GITHUB_SHA::7}" \
            --parameters "commands=[\"/opt/shopsphere/deploy.sh ${GITHUB_REF_NAME}\"]" \
            --timeout-seconds 1200 \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"
          for i in $(seq 1 90); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            echo "status=$status"
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut) aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query StandardErrorContent --output text; exit 1 ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query StandardOutputContent --output text | tail -20
          [ "$status" = Success ]
