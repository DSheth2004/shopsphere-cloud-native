# Storefront UI (nginx). Proxies /api and /status to the API gateway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: frontend, tier: web }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend, tier: web } }
    spec:
      automountServiceAccountToken: false
      # No Docker-style *_PORT=tcp://... variables: REDIS_PORT from the redis Service would break ${REDIS_PORT}.
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: frontend
          image: shopsphere/frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: API_GATEWAY_URL, valueFrom: { configMapKeyRef: { name: shopsphere-config, key: API_GATEWAY_URL } } }
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { cpu: 500m, memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20 }
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: tmp, mountPath: /tmp }
            - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - { name: conf, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, labels: { app: frontend } }
spec:
  selector: { app: frontend }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
# Edge router: JWT validation, rate limiting, routing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels: { app: api-gateway, tier: backend }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata:
      labels: { app: api-gateway, tier: backend }
      annotations: { prometheus.io/scrape: "true", prometheus.io/path: /actuator/prometheus, prometheus.io/port: "8080" }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api-gateway
          image: shopsphere/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: REDIS_HOST, valueFrom: { configMapKeyRef: { name: shopsphere-config, key: REDIS_HOST } } }
            - { name: AUTH_SERVICE_URL, valueFrom: { configMapKeyRef: { name: shopsphere-config, key: AUTH_SERVICE_URL } } }
            - { name: PRODUCT_SERVICE_URL, valueFrom: { configMapKeyRef: { name: shopsphere-config, key: PRODUCT_SERVICE_URL } } }
            - { name: INVENTORY_SERVICE_URL, valueFrom: { configMapKeyRef: { name: shopsphere-config, key: INVENTORY_SERVICE_URL } } }
            - { name: CART_SERVICE_URL, valueFrom: { configMapKeyRef: { name: shopsphere-config, key: CART_SERVICE_URL } } }
            - { name: ORDER_SERVICE_URL, valueFrom: { configMapKeyRef: { name: shopsphere-config, key: ORDER_SERVICE_URL } } }
            - { name: PAYMENT_SERVICE_URL, valueFrom: { configMapKeyRef: { name: shopsphere-config, key: PAYMENT_SERVICE_URL } } }
            - { name: NOTIFICATION_SERVICE_URL, valueFrom: { configMapKeyRef: { name: shopsphere-config, key: NOTIFICATION_SERVICE_URL } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: shopsphere-secrets, key: JWT_SECRET } } }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: "1", memory: 448Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: http }, periodSeconds: 5, failureThreshold: 60 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, periodSeconds: 10, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, periodSeconds: 20, failureThreshold: 3 }
          lifecycle: { preStop: { exec: { command: [sh, -c, "sleep 5"] } } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 64Mi } }]
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, labels: { app: api-gateway } }
spec:
  selector: { app: api-gateway }
  ports: [{ name: http, port: 8080, targetPort: http }]
