apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: shopsphere }
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway }, annotations: { prometheus.io/scrape: "true", prometheus.io/path: /actuator/prometheus, prometheus.io/port: "8080" } }
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: api-gateway
          image: shopsphere-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: shopsphere-config } }]
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 768Mi } }
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, failureThreshold: 30, periodSeconds: 5 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, initialDelaySeconds: 30 }
          lifecycle: { preStop: { exec: { command: [sh, -c, "sleep 10"] } } }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: shopsphere }
spec: { selector: { app: api-gateway }, ports: [{ port: 80, targetPort: 8080 }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api-gateway, namespace: shopsphere }
spec: { scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api-gateway }, minReplicas: 2, maxReplicas: 5, metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }] }
