# Stateful backing services. Each datastore is reachable only by the service that owns it (see network-policies.yaml).
---
# PostgreSQL for auth-service (database-per-service: only auth-service may reach it, see NetworkPolicies).
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-data }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, labels: { app: postgres, tier: data } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres, tier: data } }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: shopsphere }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: shopsphere-secrets, key: POSTGRES_PASSWORD } } }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          readinessProbe: { exec: { command: [pg_isready, -U, postgres] }, periodSeconds: 10 }
          livenessProbe: { exec: { command: [pg_isready, -U, postgres] }, periodSeconds: 20, initialDelaySeconds: 20 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: postgres-data } }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec: { selector: { app: postgres }, ports: [{ port: 5432, targetPort: postgres }] }
---
# MongoDB for product-service, order-service, inventory-service and notification-service (one database each).
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: mongo-data }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mongodb, labels: { app: mongodb, tier: data } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: mongodb } }
  template:
    metadata: { labels: { app: mongodb, tier: data } }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mongodb
          image: mongo:7
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          ports: [{ name: mongo, containerPort: 27017 }]
          resources: { requests: { cpu: 50m, memory: 192Mi }, limits: { cpu: 500m, memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          readinessProbe: { exec: { command: [mongosh, --quiet, --eval, "db.adminCommand('ping')"] }, periodSeconds: 10, timeoutSeconds: 5 }
          livenessProbe: { tcpSocket: { port: mongo }, periodSeconds: 20, initialDelaySeconds: 20 }
          volumeMounts: [{ name: data, mountPath: /data/db }, { name: configdb, mountPath: /data/configdb }, { name: tmp, mountPath: /tmp }]
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: mongo-data } }
        - { name: configdb, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: mongodb }
spec: { selector: { app: mongodb }, ports: [{ port: 27017, targetPort: mongo }] }
---
# Redis for carts (cart-service) and gateway rate limiting. The append-only file lives on a volume so carts survive restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: redis-data }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 256Mi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, labels: { app: redis, tier: data } }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis, tier: data } }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{ name: redis, containerPort: 6379 }]
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 250m, memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          readinessProbe: { exec: { command: [redis-cli, ping] }, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: redis }, periodSeconds: 20 }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: redis-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec: { selector: { app: redis }, ports: [{ port: 6379, targetPort: redis }] }
---
# RabbitMQ carries the order saga events between order, inventory, payment and notification.
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, labels: { app: rabbitmq, tier: data } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq, tier: data } }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostname: rabbitmq
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports: [{ name: amqp, containerPort: 5672 }, { name: management, containerPort: 15672 }]
          env:
            - { name: RABBITMQ_DEFAULT_USER, valueFrom: { secretKeyRef: { name: shopsphere-secrets, key: RABBITMQ_USERNAME } } }
            - { name: RABBITMQ_DEFAULT_PASS, valueFrom: { secretKeyRef: { name: shopsphere-secrets, key: RABBITMQ_PASSWORD } } }
            - { name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS, value: "+MBas ageffcbf +MHas ageffcbf +MBlmbcs 512 +MHlmbcs 512 +MMmcs 30" }
          resources: { requests: { cpu: 50m, memory: 160Mi }, limits: { cpu: 500m, memory: 384Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          readinessProbe: { exec: { command: [rabbitmq-diagnostics, -q, ping] }, periodSeconds: 15, timeoutSeconds: 10 }
          livenessProbe: { tcpSocket: { port: amqp }, periodSeconds: 30, initialDelaySeconds: 30 }
          volumeMounts: [{ name: data, mountPath: /var/lib/rabbitmq }, { name: tmp, mountPath: /tmp }]
      volumes: [{ name: data, emptyDir: {} }, { name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq }
spec: { selector: { app: rabbitmq }, ports: [{ name: amqp, port: 5672, targetPort: amqp }, { name: management, port: 15672, targetPort: management }] }
