spring:
  application: { name: inventory-service }
  # State lives in this service's own MongoDB database so it survives pod and node restarts.
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/inventory_db}
    representation.uuid: standard
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USERNAME:shopsphere}
    password: ${RABBITMQ_PASSWORD:shopsphere_local_password}
    listener.simple.retry: { enabled: true, max-attempts: 3 }
server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,prometheus
  endpoint.health.probes.enabled: true
