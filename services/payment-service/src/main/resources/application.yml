spring:
  application: { name: payment-service }
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USERNAME:shopsphere}
    password: ${RABBITMQ_PASSWORD:shopsphere_local_password}
shopsphere.payment:
  failure-rate: ${PAYMENT_FAILURE_RATE:0.0}
  card-limit: ${PAYMENT_CARD_LIMIT:50000}
resilience4j:
  retry.instances.charge: { max-attempts: 3, wait-duration: 200ms }
  circuitbreaker.instances.charge: { sliding-window-size: 10, failure-rate-threshold: 50, wait-duration-in-open-state: 20s }
server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,prometheus
  endpoint.health.probes.enabled: true
