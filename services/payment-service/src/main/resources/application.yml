spring:
  application: { name: payment-service }
  rabbitmq.host: ${RABBITMQ_HOST:localhost}
server: { port: ${SERVER_PORT:8086}, shutdown: graceful }
shopsphere.payment.failure-rate: ${PAYMENT_FAILURE_RATE:0.0}
resilience4j:
  circuitbreaker.instances.charge.sliding-window-size: 10
  retry.instances.charge.max-attempts: 3
management:
  endpoints.web.exposure.include: health,prometheus
  endpoint.health.probes.enabled: true
